  <head>
    <meta charset="UTF-8" />

    <!-- Pretendard Font CDN -->

    <style>
      .glass-card {
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.12);
      }
      .glass-neon {
        background: rgba(30, 27, 75, 0.85);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(139, 92, 246, 0.5);
        box-shadow: 0 0 25px rgba(139, 92, 246, 0.4);

      .text-gradient {

      @keyframes popRedPulse {

      .badge-pop-red {
        animation: popRedPulse 1.2s infinite ease-in-out;
        background: linear-gradient(135deg, #ef4444 0%, #dc2626 50%, #b91c1c 100%);
        color: #ffffff;

      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased font-sans min-h-screen touch-manipulation">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef, createContext, useContext } = React;

      // Audio Context Cache for Mobile Browsers
      let globalAudioCtx = null;
      const getAudioContext = () => {
        if (!globalAudioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) globalAudioCtx = new AudioContext();
        }
        if (globalAudioCtx && globalAudioCtx.state === 'suspended') {
          globalAudioCtx.resume();
        }
        return globalAudioCtx;
      };

      // Audio & Vibration Synthesizer with loud, crisp mobile sound
      const playAudioEffect = (type, count = 1) => {
        try {
          if (typeof window !== 'undefined' && 'vibrate' in navigator) {
            if (type === 'click' || type === 'squat') navigator.vibrate(30);
            else if (type === 'success') navigator.vibrate([40, 60, 40]);
            else if (type === 'fanfare') navigator.vibrate([100, 50, 100, 50, 200]);
            else if (type === 'wrong') navigator.vibrate([80, 40, 80]);
          }
        } catch (e) {}

        try {
          const ctx = getAudioContext();
          if (!ctx) return;
          const now = ctx.currentTime;

          if (type === 'squat') {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);

            const pitch = 350 + count * 45;
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(pitch, now);
            osc.frequency.exponentialRampToValueAtTime(pitch + 250, now + 0.12);

            gain.gain.setValueAtTime(0.7, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);

            osc.start(now);
            osc.stop(now + 0.12);
          } else if (type === 'click') {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.exponentialRampToValueAtTime(800, now + 0.05);
            gain.gain.setValueAtTime(0.4, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
            osc.start(now);
            osc.stop(now + 0.05);
          } else if (type === 'success') {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.setValueAtTime(659.25, now + 0.1);
            osc.frequency.setValueAtTime(783.99, now + 0.2);
            gain.gain.setValueAtTime(0.5, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
            osc.start(now);
            osc.stop(now + 0.35);
          } else if (type === 'fanfare') {
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, idx) => {
              const o = ctx.createOscillator();
              const g = ctx.createGain();
              o.type = 'sine';
              o.frequency.setValueAtTime(freq, now + idx * 0.12);
              g.gain.setValueAtTime(0.4, now + idx * 0.12);
              g.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.12 + 0.3);
              o.connect(g);
              g.connect(ctx.destination);
              o.start(now + idx * 0.12);
              o.stop(now + idx * 0.12 + 0.3);
            });
          } else if (type === 'wrong') {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.exponentialRampToValueAtTime(110, now + 0.2);
            gain.gain.setValueAtTime(0.4, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
          }
        } catch (e) {}
      };

      // User Context
      const UserContext = createContext();

      const UserProvider = ({ children }) => {
        const [profile, setProfile] = useState(() => {
          const saved = localStorage.getItem('cf_profile');
          return saved ? JSON.parse(saved) : { affiliation: '', name: '', avatar: '👨‍🏫' };
        });

        const [bodyMissions, setBodyMissions] = useState(() => {
          const saved = localStorage.getItem('cf_body');
          if (saved) {
            try {
              const parsed = JSON.parse(saved);
              return {
                walk10s: !!parsed.walk10s || !!parsed.walk20s,
                squats10: !!parsed.squats10 || !!parsed.squats30,
                balance10s: !!parsed.balance10s,
                water1cup: !!parsed.water1cup,
                highfive: !!parsed.highfive
              };
            } catch(e) {}
          }
          return { walk10s: false, squats10: false, balance10s: false, water1cup: false, highfive: false };
        });

        const [brainQuiz, setBrainQuiz] = useState(() => {
          const saved = localStorage.getItem('cf_brain_quiz');
          return saved ? JSON.parse(saved) : { completed: false, score: 0, level: '🏆 뇌 청춘 S급 (뇌 연령 10대 슈퍼 브레인!)' };
        });

        const [review, setReview] = useState(() => {
          const saved = localStorage.getItem('cf_review');
          return saved ? JSON.parse(saved) : { completed: false, idea: '', boothReview: '', rating: 5 };
        });

        const [activeTab, setActiveTab] = useState('home');

        const [allReviews, setAllReviews] = useState(() => {
          const savedFeed = localStorage.getItem('cf_all_reviews');
          return savedFeed ? JSON.parse(savedFeed) : [
            { id: 1, name: '김민수 선생님', affiliation: '전북초등학교', idea: '수학 퀴즈 생성을 AI 프롬프트로 3초 만에 만들기!', review: '10가지 뇌 훈련 퀴즈가 너무 신나고 몰입감 넘쳤습니다! 👍', date: '방금 전', score: 300 },
            { id: 2, name: '박지현 교사', affiliation: '전북중학교', idea: '학급 규칙 칭찬 카드를 바이브 코딩으로 제작예정', review: '거울글자 맞추기와 스트룹 퀴즈가 뇌를 확 깨워주네요!', date: '3분 전', score: 300 },
            { id: 3, name: '이동현 선생님', affiliation: '전북고등학교', idea: '정보 수업 프롬프트 엔지니어링 미니 탐험대 운영', review: '교사 페스티벌 부스 중 가장 재미있고 기발합니다!', date: '5분 전', score: 280 },
          ];
        });

        // Strictly calculate bodyScore for ONLY the 5 active mission keys, capped at 100
        const ACTIVE_KEYS = ['walk10s', 'squats10', 'balance10s', 'water1cup', 'highfive'];
        const completedCount = ACTIVE_KEYS.filter(k => !!bodyMissions[k]).length;
        const bodyScore = Math.min(100, completedCount * 20);

        const brainQuizScore = brainQuiz.completed ? 100 : 0;
        const reviewScore = review.completed ? 100 : 0;
        const totalScore = bodyScore + brainQuizScore + reviewScore;
        const isStickerActive = totalScore >= 300;

        useEffect(() => { localStorage.setItem('cf_profile', JSON.stringify(profile)); }, [profile]);
        useEffect(() => { localStorage.setItem('cf_body', JSON.stringify(bodyMissions)); }, [bodyMissions]);
        useEffect(() => { localStorage.setItem('cf_brain_quiz', JSON.stringify(brainQuiz)); }, [brainQuiz]);
        useEffect(() => { localStorage.setItem('cf_review', JSON.stringify(review)); }, [review]);
        useEffect(() => { localStorage.setItem('cf_all_reviews', JSON.stringify(allReviews)); }, [allReviews]);

        const updateProfile = (affiliation, name, avatar) => {
          setProfile({ affiliation, name, avatar });
        };

        const logoutProfile = () => {
          setProfile({ affiliation: '', name: '', avatar: '👨‍🏫' });
          setBodyMissions({ walk10s: false, squats10: false, balance10s: false, water1cup: false, highfive: false });
          setBrainQuiz({ completed: false, score: 0, level: '🏆 뇌 청춘 S급 (뇌 연령 10대 슈퍼 브레인!)' });
          setReview({ completed: false, idea: '', boothReview: '', rating: 5 });
          localStorage.removeItem('cf_profile');
          localStorage.removeItem('cf_body');
          localStorage.removeItem('cf_brain_quiz');
          localStorage.removeItem('cf_review');
          playAudioEffect('click');
        };

        const toggleBodyMission = (key) => {
          setBodyMissions(prev => {
            const next = { ...prev, [key]: !prev[key] };
            if (!prev[key]) playAudioEffect('success');
            return next;
          });
        };

        const completeBrainQuiz = (scorePoints, levelGrade) => {
          setBrainQuiz({ completed: true, score: scorePoints, level: levelGrade });
          playAudioEffect('success');
        };

        const resetBrainQuiz = () => {
          setBrainQuiz({ completed: false, score: 0, level: '' });
          playAudioEffect('click');
        };

        const submitReviewData = (ideaText, boothReviewText, ratingVal) => {
          setReview({ completed: true, idea: ideaText, boothReview: boothReviewText, rating: ratingVal });
          setAllReviews(prev => [{
            id: Date.now(),
            name: profile.name || '선생님',
            affiliation: profile.affiliation || '전북교육청 교사',
            idea: ideaText,
            review: boothReviewText,
            date: '방금 전',
            score: totalScore + 100
          }, ...prev]);
          playAudioEffect('fanfare');
        };

        const resetReview = () => {
          setReview({ completed: false, idea: '', boothReview: '', rating: 5 });
          playAudioEffect('click');
        };

        return (
          <UserContext.Provider value={{
            profile, updateProfile, logoutProfile, bodyMissions, toggleBodyMission, bodyScore,
            brainQuiz, completeBrainQuiz, resetBrainQuiz, brainQuizScore, review, submitReviewData, resetReview, reviewScore,
            totalScore, isStickerActive, activeTab, setActiveTab, allReviews
          }}>
            {children}
          </UserContext.Provider>
        );
      };

      const useUser = () => useContext(UserContext);

      // Header Component with Official Image Logo in Top-Left and Padlet Link Placeholder on Top-Right
      function Header() {
        const { profile, totalScore, isStickerActive, setActiveTab } = useUser();
        return (
          <header className="sticky top-0 z-40 w-full glass-card border-b border-purple-500/20 px-3 py-2 shadow-lg">
            <div className="max-w-md mx-auto flex items-center justify-between">
              <button 
                onClick={() => { playAudioEffect('click'); setActiveTab('home'); }}
                className="flex items-center hover:scale-105 transition-transform"
                title="홈으로 이동"
              >
                <img 
                  src="./logo.jpg" 
                  alt="전북특별자치도교육청" 
                  className="h-8 sm:h-9 rounded-lg bg-white px-2 py-1 object-contain shadow-md"
                />
              </button>

              <div className="flex items-center space-x-2">
                {profile.name && (
                  <div className="flex items-center gap-1 bg-slate-900/90 border border-slate-800 rounded-full px-2 py-0.5">
                    <span className="text-xs">{profile.avatar || '👨‍🏫'}</span>
                    <div className={`flex items-center gap-0.5 px-2 py-0.5 rounded-full text-xs font-black ${
                      isStickerActive ? 'bg-amber-400 text-slate-950' : 'bg-purple-950 text-purple-300'
                    }`}>
                      🏆 {totalScore}p
                    </div>
                  </div>
                )}

                {/* Padlet Link Placeholder Button */}
                <a
                  href="#"
                  onClick={(e) => {
                    e.preventDefault();
                    playAudioEffect('click');
                    alert('📌 패들렛 바로가기 링크 준비 중입니다!');
                  }}
                  className="px-2.5 py-1 rounded-xl border text-[10px] font-bold bg-gradient-to-r from-pink-500 to-rose-600 text-white border-pink-400/50 hover:border-pink-300 transition-all flex items-center gap-1 shadow-md hover:scale-105 active:scale-95"
                  title="패들렛 바로가기 (나중에 링크 연결)"
                >
                  <span>📌</span>
                  <span>패들렛</span>
                </a>
              </div>
            </div>
          </header>
        );
      }

      // Fixed Bottom Navigation Bar
      function AlwaysVisibleNavBar() {
        const { activeTab, setActiveTab, bodyScore, brainQuizScore, reviewScore, totalScore, isStickerActive } = useUser();
        
        const tabs = [
          { id: 'mission', label: '미션', icon: '🏃', badge: `${bodyScore}/100` },
          { id: 'quiz', label: '퀴즈', icon: '❓', badge: `${brainQuizScore}/100` },
          { id: 'home', label: '홈', icon: '🏠', badge: null },
          { id: 'review', label: '소감작성', icon: '📝', badge: `${reviewScore}/100` },
          { id: 'sticker', label: '트로피', icon: '🏆', badge: isStickerActive ? 'ON!' : `${totalScore}p` },
        ];

        return (
          <nav className="fixed bottom-0 left-0 right-0 z-50 w-full glass-card border-t border-cyan-500/30 px-2 py-2 shadow-2xl bg-slate-950/95 backdrop-blur-xl">
            <div className="max-w-md mx-auto grid grid-cols-5 gap-1 sm:gap-1.5">
              {tabs.map((t) => {
                const isActive = activeTab === t.id;
                return (
                  <button
                    key={t.id}
                    onClick={() => { playAudioEffect('click'); setActiveTab(t.id); }}
                    className={`flex flex-col items-center justify-between py-1.5 px-0.5 rounded-2xl transition-all duration-200 shadow-md relative min-h-[58px] ${
                      isActive 
                        ? 'bg-gradient-to-b from-cyan-400 to-blue-600 text-slate-950 font-black ring-2 ring-cyan-300 scale-105 shadow-[0_0_20px_rgba(6,182,212,0.7)]' 
                        : 'bg-slate-900 text-slate-200 border border-slate-800 hover:border-cyan-500/50'
                    }`}
                  >
                    {/* 1. TOP: 점수 뱃지 (메뉴 그림 위로 이동) */}
                    {t.badge ? (
                      <span className={`text-[9.5px] sm:text-[10.5px] font-black px-1.5 py-0.2 rounded-full mb-0.5 badge-pop-red tracking-tight shadow-md ${
                        isActive ? 'ring-2 ring-yellow-300 scale-105' : ''
                      }`}>
                        {t.badge}
                      </span>
                    ) : (
                      <span className="text-[9.5px] opacity-0 mb-0.5">.</span>
                    )}

                    {/* 2. MIDDLE: 메뉴 아이콘/그림 */}
                    <span className="leading-none my-0.5 text-lg sm:text-xl">{t.icon}</span>

                    {/* 3. BOTTOM: 메뉴 글씨 */}
                    {t.label ? (
                      <span className={`text-[10px] sm:text-[11px] font-black tracking-tighter truncate w-full text-center ${isActive ? 'text-slate-950' : 'text-white'}`}>
                        {t.label}
                      </span>
                    ) : null}
                  </button>
                );
              })}
            </div>
          </nav>
        );
      }

      // 1. Home Screen
      function HomeScreen() {
        const { profile, updateProfile, logoutProfile, setActiveTab } = useUser();
        const [affiliation, setAffiliation] = useState(profile.affiliation || '');
        const [name, setName] = useState(profile.name || '');
        const [avatar, setAvatar] = useState(profile.avatar || '👨‍🏫');

        useEffect(() => {
          setAffiliation(profile.affiliation || '');
          setName(profile.name || '');
          setAvatar(profile.avatar || '👨‍🏫');
        }, [profile]);

        const handleAffiliationChange = (val) => {
          setAffiliation(val);
          updateProfile(val, name, avatar);
        };

        const handleNameChange = (val) => {
          setName(val);
          updateProfile(affiliation, val, avatar);
        };

        const handleAvatarChange = (av) => {
          setAvatar(av);
          updateProfile(affiliation, name, av);
        };

        const avatarList = [
          { emoji: '👨‍🏫', label: '남교사' },
          { emoji: '👩‍🏫', label: '여교사' },
          { emoji: '🏃‍♂️', label: '남러너' },
          { emoji: '🏃‍♀️', label: '여러너' },
          { emoji: '👩‍💻', label: '코더' },
          { emoji: '🧙‍♂️', label: '마법사' },
          { emoji: '🦸‍♀️', label: '히어로' },
          { emoji: '👨‍🚀', label: '우주인' },
          { emoji: '🦊', label: '스마트여우' },
          { emoji: '🤖', label: 'AI봇' },
        ];

        return (
          <div className="max-w-md mx-auto space-y-5 text-center">
            {/* Main Title */}
            <div className="space-y-1.5 pt-2">
              <h1 className="text-2xl sm:text-3xl font-black text-white leading-tight tracking-tight">
                2026 학생 건강증진<br />
                <span className="text-gradient">수업 페스티벌</span>
              </h1>
              <p className="text-sm sm:text-base font-black text-cyan-300 tracking-tight pt-2 drop-shadow-[0_0_10px_rgba(6,182,212,0.8)]">
                바이브 코딩과 보건교육이 만난다면?
              </p>
            </div>

            {/* Center Graphic Artwork */}
            <div className="relative py-4 my-2 animate-float">
              <div className="w-64 h-64 sm:w-72 sm:h-72 mx-auto rounded-full bg-gradient-to-tr from-purple-600 via-blue-600 to-cyan-400 p-1 shadow-[0_0_50px_rgba(6,182,212,0.6)] flex items-center justify-center relative">
                <div className="w-full h-full bg-slate-950 rounded-full flex flex-col items-center justify-between relative py-6 px-3 text-center">
                  <div className="absolute inset-0 bg-purple-900/20 rounded-full blur-xl pointer-events-none"></div>
                  
                  {/* 1. TOP TITLE (Moved up inside top circle curve) */}
                  <div className="text-[11px] sm:text-xs font-black text-cyan-300 drop-shadow-[0_0_8px_rgba(6,182,212,0.9)] whitespace-nowrap pt-3.5 sm:pt-4 tracking-tight">
                    AI랑 함께 하는 건강 퀴즈 미션 🎯
                  </div>

                  {/* 2. CENTER POPPING TEXT (Extends beyond circle for maximum visibility) */}
                  <div className="my-auto z-30 w-full flex items-center justify-center relative">
                    <div className="py-3 px-3 sm:px-5 bg-gradient-to-r from-amber-400 via-yellow-300 to-amber-500 text-slate-950 font-black text-sm sm:text-base rounded-2xl sm:rounded-3xl shadow-[0_0_40px_rgba(245,158,11,1)] border-4 border-yellow-100 animate-bounce text-center leading-snug tracking-tight whitespace-nowrap -mx-8 sm:-mx-12 transform scale-105">
                      🏆 300점 획득후 트로피를 캡쳐해서<br />
                      <span className="text-slate-950">패들렛에 올리면 선물이 팡팡! 🎁</span>
                    </div>
                  </div>

                  {/* 3. BOTTOM EMOJIS */}

          banner: <div className="flex items-center justify-center bg-slate-900/90 py-4 px-3 rounded-2xl border border-yellow-500/40 shadow-[0_0_20px_rgba(234,179,8,0.2)]"><span className="text-3xl sm:text-4xl font-black text-yellow-300 drop-shadow-[0_0_10px_rgba(253,224,71,0.8)]">1</span><span className="text-xs sm:text-sm text-slate-400 font-normal px-1.5 opacity-70">➔</span><span className="text-3xl sm:text-4xl font-black text-amber-400 drop-shadow-[0_0_10px_rgba(251,191,36,0.8)]">2</span><span className="text-xs sm:text-sm text-slate-400 font-normal px-1.5 opacity-70">➔</span><span className="text-3xl sm:text-4xl font-black text-emerald-300 drop-shadow-[0_0_10px_rgba(110,231,183,0.8)]">4</span><span className="text-xs sm:text-sm text-slate-400 font-normal px-1.5 opacity-70">➔</span><span className="text-3xl sm:text-4xl font-black text-cyan-300 drop-shadow-[0_0_10px_rgba(103,232,249,0.8)]">7</span><span className="text-xs sm:text-sm text-slate-400 font-normal px-1.5 opacity-70">➔</span><span className="text-3xl sm:text-4xl font-black text-rose-400 underline animate-bounce drop-shadow-[0_0_12px_rgba(251,113,133,0.9)]">?</span></div>,
          options: [
            { text: "① 10", isCorrect: false },
            { text: "② 12", isCorrect: false },
            { text: "③ 9", isCorrect: false },
            { text: "④ 11", isCorrect: true },
          ],
          answerText: "④ 11",
          explanation: "숫자가 차례대로 +1, +2, +3, +4씩 늘어나는 계수수열 규칙입니다. (7 + 4 = 11)"
        },
        {
          title: "[9단계: 미래 수업 비전]",
          question: "'선생님의 열정' + '학생의 참여'가 만났을 때 일어나는 궁극적인 변화는?",
          banner: <div className="text-lg sm:text-xl font-black text-amber-300 bg-slate-900/90 py-3.5 px-3 rounded-2xl border border-amber-500/40 text-center shadow-[0_0_20px_rgba(245,158,11,0.2)]">🔥 선생님의 열정 ➕ 🙋‍♀️ 학생의 참여 = ❓</div>,
          options: [
            { text: "① 단순 지식 암기", isCorrect: false },
            { text: "② 배움이 즐거운 성장 중심 수업", isCorrect: true },
            { text: "③ 야간 자율학습 강화", isCorrect: false },
            { text: "④ 시험 점수 줄 세우기", isCorrect: false },
          ],
          answerText: "② 배움이 즐거운 성장 중심 수업",
          explanation: "교사의 열정과 학생의 적극적인 참여가 만났을 때 배움이 즐거운 성장 중심의 미래 수업이 펼쳐집니다."
        },
        {
          title: "[10단계: 뇌 청춘 최종선언]",
          question: "보건교육과 코딩의 시너지는?",
          options: [
            { text: "① 어려운 코딩 포기하기", isCorrect: false },
            { text: "② 🚀 자연어 프롬프트로 기발한 수업 도구 즉시 완성하기", isCorrect: true },
          ],
          answerText: "② 🚀 자연어 프롬프트로 기발한 수업 도구 즉시 완성하기",
          explanation: "보건교육과 바이브 코딩이 만나면 AI 프롬프트만으로 나만의 기발한 건강 수업 앱을 즉시 만들 수 있습니다."
        }
      ];

      function QuizTab() {
        const { brainQuiz, completeBrainQuiz, resetBrainQuiz, brainQuizScore, setActiveTab } = useUser();
        const [step, setStep] = useState(0);
        const [score, setScore] = useState(0);
        const [wrongIndices, setWrongIndices] = useState([]);
        const [isCorrectSolved, setIsCorrectSolved] = useState(false);

        const currentQ = questionsData[step];

        const handlePickOption = (idx, isCorrect) => {
          if (isCorrectSolved) return;

          if (isCorrect) {
            playAudioEffect('success');
            setIsCorrectSolved(true);
            setScore(s => s + 10);
          } else {
            playAudioEffect('wrong');
            if (!wrongIndices.includes(idx)) {
              setWrongIndices(prev => [...prev, idx]);
            }
          }
        };

        const handleNextStep = () => {
          if (!isCorrectSolved) return;

          setIsCorrectSolved(false);
          setWrongIndices([]);

          if (step < 9) {
            setStep(s => s + 1);
          } else {
            let levelGrade = '🏆 뇌 청춘 S급 (뇌 연령 10대 슈퍼 브레인!)';
            if (score < 70) levelGrade = '🧠 뇌 활력 A급 (뇌 연령 20대!)';
            if (score < 50) levelGrade = '👍 뇌 건강 B급 (뇌 활성 진행 중!)';
            completeBrainQuiz(score, levelGrade);
          }
        };

        const handleRestart = () => {
          setStep(0);
          setScore(0);
          setWrongIndices([]);
          setIsCorrectSolved(false);
          resetBrainQuiz();
        };

        return (
          <div className="max-w-md mx-auto space-y-4 pt-2">
            {/* Prominent Quiz Header Card */}
            <div className="glass-card rounded-3xl p-4 sm:p-5 border border-purple-500/40 text-center space-y-2 shadow-2xl">
              <div className="flex items-center justify-between">
                <span className="text-[11px] sm:text-xs font-extrabold text-cyan-400 tracking-tight flex items-center gap-1">
                  <span>⚡</span> 뇌 자극 10단계 챌린지
                </span>
                <span className="text-sm font-black text-amber-300 bg-slate-900 px-3 py-1 rounded-full border border-amber-500/50 shadow-[0_0_15px_rgba(245,158,11,0.4)] flex items-center gap-1 animate-bounce">
                  <span>✨</span>
                  <span>{brainQuiz.completed ? brainQuizScore : score}</span>
                  <span className="text-[10px] text-slate-400 font-normal">/ 100p</span>
                </span>
              </div>
              <h2 className="text-lg sm:text-xl font-black text-amber-300 tracking-tight whitespace-nowrap overflow-hidden text-ellipsis drop-shadow-[0_0_12px_rgba(245,158,11,0.6)] pt-1">
                🧠 당신의 뇌 나이는 지금 몇 살? ❓
              </h2>
            </div>

            {!brainQuiz.completed ? (
              <div className="glass-card rounded-3xl p-6 border border-purple-500/20 text-center space-y-5">
                <div className="flex justify-between items-center text-xs font-bold text-purple-300 border-b border-purple-500/20 pb-2">
                  <span>❓ 뇌 활성화 트레이닝</span>
                  <span>문제 {step + 1} / 10</span>
                </div>

                <div className="space-y-4 text-left">
                  <h3 className="font-extrabold text-sm text-white leading-relaxed">
                    <span className="text-cyan-300 font-black mr-1.5">{currentQ.title}</span>
                    {currentQ.question}
                  </h3>
                  {currentQ.banner}

                  <div className={`grid gap-2.5 pt-1 ${currentQ.options.length > 2 ? 'grid-cols-1 sm:grid-cols-2' : 'grid-cols-1'}`}>
                    {currentQ.options.map((opt, idx) => {
                      const isWrongChoice = wrongIndices.includes(idx);
                      let btnStyle = "w-full py-3.5 px-4 bg-slate-900/90 text-slate-100 font-bold text-xs rounded-xl border border-slate-700 hover:border-purple-500 hover:bg-purple-950/30 transition-all text-left flex items-center justify-between";

                      if (isCorrectSolved) {
                        if (opt.isCorrect) {
                          btnStyle = "w-full py-3.5 px-4 bg-emerald-950/90 border-2 border-emerald-400 text-emerald-200 font-black text-xs rounded-xl shadow-[0_0_15px_rgba(16,185,129,0.4)] text-left flex items-center justify-between animate-pulse";
                        } else {
                          btnStyle = "w-full py-3.5 px-4 bg-slate-900/40 text-slate-500 font-bold text-xs rounded-xl border border-slate-800/50 opacity-40 text-left flex items-center justify-between cursor-not-allowed";
                        }
                      } else if (isWrongChoice) {
                        btnStyle = "w-full py-3.5 px-4 bg-rose-950/80 border-2 border-rose-500 text-rose-300 font-bold text-xs rounded-xl text-left flex items-center justify-between opacity-70 cursor-not-allowed";
                      }

                      return (
                        <button
                          key={idx}
                          onClick={() => handlePickOption(idx, opt.isCorrect)}
                          disabled={isCorrectSolved || isWrongChoice}
                          className={`${btnStyle} ${opt.colorClass || ''}`}
                        >
                          <span>{opt.text}</span>
                          {isCorrectSolved && opt.isCorrect && <span className="text-xs font-black text-emerald-300">⭕ 정답!</span>}
                          {isWrongChoice && <span className="text-xs font-black text-rose-300">❌ 오답</span>}
                        </button>
                      );
                    })}
                  </div>

                  {/* Feedback Banner on Wrong Pick */}
                  {!isCorrectSolved && wrongIndices.length > 0 && (
                    <div className="p-3 bg-amber-950/80 border-2 border-amber-500/80 text-amber-200 text-center font-extrabold text-xs rounded-xl animate-bounce shadow-lg flex items-center justify-center gap-2">
                      <span>😅</span>
                      <span>다시 한번 풀어 보세요!</span>
                    </div>
                  )}

                  {/* Revealed Answer & Explanation Box ONLY ON CORRECT PICK */}
                  {isCorrectSolved && (
                    <div className="space-y-2.5 pt-2">
                      <div className="p-2.5 rounded-xl border border-emerald-500/60 bg-emerald-950/90 text-emerald-300 text-center font-black text-xs flex items-center justify-center gap-2 shadow-lg">
                        <span>🎉 정답입니다!</span>
                      </div>

                      <div className="p-3.5 bg-purple-950/50 rounded-xl border border-purple-500/40 text-xs text-slate-300 space-y-1 text-left shadow-lg">
                        <div className="font-extrabold text-cyan-300 flex items-center gap-1.5">
                          <span>💡</span>
                          <span>정답: {currentQ.answerText}</span>
                        </div>
                        <p className="text-[11px] text-slate-200 leading-snug">
                          해설: {currentQ.explanation}
                        </p>
                      </div>
                    </div>
                  )}
                </div>

                {/* Compact Bottom Navigation Arrows */}
                <div className="flex items-center justify-between pt-3 border-t border-slate-800/80 mt-4">
                  <button
                    type="button"
                    onClick={() => {
                      playAudioEffect('click');
                      setIsCorrectSolved(false);
                      setWrongIndices([]);
                      setStep(s => Math.max(0, s - 1));
                    }}
                    disabled={step === 0}
                    className={`px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1 transition-all ${
                      step === 0 
                        ? 'bg-slate-900/40 text-slate-600 border border-slate-800/50 cursor-not-allowed opacity-40' 
                        : 'bg-slate-900 text-slate-200 border border-slate-700 hover:border-purple-500 hover:text-white'
                    }`}
                  >
                    <span>⬅️</span>
                    <span>이전</span>
                  </button>

                  <span className="text-[11px] font-black text-purple-300 bg-slate-900 px-2.5 py-0.5 rounded-full border border-purple-500/30">
                    {step + 1} / 10
                  </span>

                  <button
                    type="button"
                    onClick={handleNextStep}
                    className="px-3.5 py-1.5 bg-gradient-to-r from-purple-600 to-cyan-500 text-white text-xs font-black rounded-xl border border-cyan-400/40 shadow-md hover:scale-105 active:scale-95 transition-all flex items-center gap-1"
                  >
                    <span>{step === 9 ? '완료' : '다음'}</span>
                    <span>➡️</span>
                  </button>
                </div>
              </div>
            ) : (
              <div className="glass-card rounded-3xl p-6 text-center space-y-4 border border-emerald-500/30">
                <div className="text-4xl animate-bounce">🎉</div>
                <h3 className="text-xl font-black text-white">🎉 퀴즈 완료! (100점)</h3>
                <div className="text-lg font-black text-gradient bg-slate-900/90 py-3 rounded-2xl border border-purple-500/40 shadow-lg">
                  {brainQuiz.level}
                </div>

                <button
                  onClick={() => {
                    playAudioEffect('fanfare');
                    setActiveTab('review');
                  }}
                  className="w-full py-3.5 bg-gradient-to-r from-pink-500 via-purple-600 to-cyan-500 text-white font-black text-sm rounded-2xl shadow-xl hover:scale-105 active:scale-95 transition-all flex items-center justify-center gap-2"
                >
                  <span>📝</span>
                  <span>소감 작성하러 가기 ➔</span>
                </button>
              </div>
            )}
          </div>
        );
      }

      // 4. Review View
      function ReviewTab() {
        const { review, submitReviewData, resetReview, reviewScore, setActiveTab } = useUser();
        const [idea, setIdea] = useState(review.idea || '');
        const [boothReview, setBoothReview] = useState(review.boothReview || '');

        const handleSubmit = (e) => {
          e.preventDefault();
          if (!idea.trim() || !boothReview.trim()) return alert('모두 적어주세요!');
          submitReviewData(idea, boothReview, 5);
        };

        return (
          <div className="max-w-md mx-auto space-y-4 pt-2">
            <div className="glass-card rounded-3xl p-5 border border-purple-500/30 flex justify-between items-center">
              <div>
                <span className="text-[10px] font-bold text-pink-400">부스 소감 & 수업 아이디어</span>
                <h2 className="text-xl font-black text-white">소감 한마디</h2>
              </div>
              <div className="text-2xl font-black text-cyan-400">{reviewScore} <span className="text-xs text-slate-400">/ 100p</span></div>
            </div>

            {!review.completed ? (
              <form onSubmit={handleSubmit} className="glass-card rounded-3xl p-6 border border-purple-500/20 space-y-4">
                <div>
                  <label className="block text-xs font-bold text-slate-200 mb-1">💡 수업 적용 아이디어 *</label>
                  <textarea
                    required rows={3} placeholder="예: 역사 퀴즈 봇 프롬프트 만들기 수업"
                    value={idea} onChange={e => setIdea(e.target.value)}
                    className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-white outline-none"
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-200 mb-1">💬 부스 한줄 소감 *</label>
                  <input
                    type="text" required placeholder="예: 최고로 재미있는 페스티벌 부스입니다!"
                    value={boothReview} onChange={e => setBoothReview(e.target.value)}
                    className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white outline-none"
                  />
                </div>

                <button type="submit" className="w-full py-4 rounded-2xl bg-gradient-to-r from-pink-500 to-cyan-400 text-white font-black text-sm">
                  소감 제출하기 ➔
                </button>
              </form>
            ) : (
              <div className="glass-card rounded-3xl p-6 text-center space-y-4 border border-emerald-500/30">
                <div className="text-4xl animate-bounce">📝</div>
                <h3 className="text-lg font-black text-white">✅ 소감 제출 완료!</h3>
                <p className="text-xs text-cyan-300 font-bold">소중한 의견과 아이디어가 성공적으로 작성되었습니다.</p>
                
                <div className="pt-2 flex flex-col items-center gap-3">
                  <button
                    type="button"
                    onClick={() => { resetReview(); }}
                    className="px-4 py-2 bg-slate-900/90 text-slate-300 hover:text-white font-bold text-xs rounded-xl border border-slate-700 hover:border-pink-500/50 transition-all inline-flex items-center gap-1.5 shadow-md active:scale-95"
                  >
                    <span>🔄</span>
                    <span>소감 다시 작성하기</span>
                  </button>

                  <div className="w-full pt-3 border-t border-purple-500/30">
                    <button
                      type="button"
                      onClick={() => {
                        playAudioEffect('fanfare');
                        setActiveTab('sticker');
                      }}
                      className="w-full py-3.5 bg-gradient-to-r from-amber-400 via-yellow-300 to-amber-500 text-slate-950 font-black text-xs sm:text-sm rounded-2xl shadow-[0_0_20px_rgba(245,158,11,0.5)] border-2 border-yellow-100 hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-2"
                    >
                      <span>🏆</span>
                      <span>트로피를 캡쳐해서 패들렛에 올려주세요 ➔</span>
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      // 5. Sticker Pass View
      function StickerTab() {
        const { totalScore, isStickerActive, setActiveTab } = useUser();

        useEffect(() => {
          if (isStickerActive && typeof confetti !== 'undefined') {
            confetti({ particleCount: 80, spread: 60, origin: { y: 0.6 } });
          }
        }, [isStickerActive]);

        return (
          <div className="max-w-md mx-auto space-y-5 pt-2">
            <div className="glass-card rounded-3xl p-5 border border-purple-500/30 flex justify-between items-center">
              <div>
                <span className="text-[10px] font-bold text-amber-400">최종 완주 현황</span>
                <h2 className="text-xl font-black text-white">트로피</h2>
              </div>
              <div className="text-2xl font-black text-amber-400">{totalScore} <span className="text-xs text-slate-400">/ 300p</span></div>
            </div>

            {/* Simple Sticker Status Card */}
            <div className={`rounded-3xl p-8 text-center ${isStickerActive ? 'glass-neon border-amber-400' : 'glass-card border-slate-800'}`}>
              {isStickerActive ? (
                <div className="py-2 space-y-3">
                  <div className="w-20 h-20 rounded-full mx-auto flex items-center justify-center text-4xl bg-amber-400 text-slate-950 shadow-[0_0_30px_rgba(245,158,11,0.9)] animate-bounce">
                    🏆
                  </div>
                  <h3 className="text-xl font-black gold-gradient">미션을 모두 완료하였습니다! 🎉</h3>
                  
                  <button
                    type="button"
                    onClick={() => {
                      playAudioEffect('click');
                      setActiveTab('home');
                    }}
                    className="w-full py-3.5 px-3 bg-gradient-to-r from-amber-400 via-yellow-300 to-amber-500 text-slate-950 font-black text-xs sm:text-sm rounded-2xl shadow-[0_0_25px_rgba(245,158,11,0.6)] border-2 border-yellow-100 hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-2 mt-2"
                  >
                    <span>📸</span>
                    <span>이 화면을 캡쳐해서 홈 우상단의 패들렛에 올려주세요 ➔</span>
                  </button>
                </div>
              ) : (
                <div className="space-y-3">
                  <div className="w-20 h-20 rounded-full mx-auto flex items-center justify-center text-4xl bg-slate-900 border border-slate-800 text-amber-400 animate-pulse">
                    🔥
                  </div>
                  <h3 className="text-base font-black text-white">아자아자 화이팅! 💪</h3>
                  <p className="text-xs text-slate-400">300점 도달 시 황금 트로피 불이 켜집니다! ({300 - totalScore}점 남음)</p>
                </div>
              )}
            </div>
          </div>
        );
      }

      // App Main Render
      function App() {
        const { activeTab } = useUser();
        return (
          <div className="min-h-screen bg-slate-950 text-slate-100 relative pb-24">
            <Header />
            <main className="px-4 py-3">
              {activeTab === 'home' && <HomeScreen />}
              {activeTab === 'mission' && <MissionTab />}
              {activeTab === 'quiz' && <QuizTab />}
              {activeTab === 'review' && <ReviewTab />}
              {activeTab === 'sticker' && <StickerTab />}
            </main>
            <AlwaysVisibleNavBar />
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(
        <UserProvider>
          <App />
        </UserProvider>
      );
    </script>
  </body>
</html>
